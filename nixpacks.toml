[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "php82Extensions.exif", "php82Extensions.pdo_mysql", "php82Extensions.redis", "nodejs_18"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-exif",
  "npm install",
  "npm run production"
]

[phases.build]
cmds = [
  "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/framework/testing storage/logs bootstrap/cache",
  "chmod -R 777 storage bootstrap/cache"
]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
